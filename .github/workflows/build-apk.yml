name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
        

    - name: Extract Android project
    run: |
     unzip -q Engineer_Ben_HouseSketch_Android_v1.1.0.zip -d android-project
     echo "PROJECT_DIR=$(dirname "$(find android-project -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)")" >> "$GITHUB_ENV"


     - name: Extract Android project
      run: |
        unzip -q Engineer_Ben_HouseSketch_Android_*.zip -d android-project
        echo "PROJECT_DIR=$(dirname "$(find android-project -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)")" >> "$GITHUB_ENV"

     - name: Build APK
      run: |
        gradle -p "$PROJECT_DIR" assembleDebug     

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Engineer_Ben_HouseSketch
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
